<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Web Output #3</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: white;
            color: #111;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        button {
            padding: 6px 10px;
            margin-right: 5px;
            border: 1px solid #777;
            background-color: #f5f5f5;
            cursor: pointer;
            border-radius: 3px;
        }

        button:hover {
            background-color: #ddd;
        }

        .api-link {
            margin: 10px 0 15px;
            font-size: 16px;
        }

        .api-link a {
            color: #551a8b;
        }

        table {
            width: 95%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #777;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f5f5f5;
            text-align: center;
            font-weight: bold;
        }

        td:nth-child(1),
        td:nth-child(2) {
            text-align: center;
            width: 80px;
        }

        td:nth-child(4) {
            text-align: center;
            font-weight: bold;
        }

        .completed {
            color: green;
        }

        .not-completed {
            color: red;
        }

        #loading {
            display: none;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Javascript Web Output #3</h1>

    <button id="loadBtn">Load data from the API</button>
    <button id="clearBtn">Clear Table</button>

    <div class="api-link">
        API:
        <a href="https://jsonplaceholder.typicode.com/todos/" target="_blank">
            https://jsonplaceholder.typicode.com/todos/
        </a>
    </div>

    <div id="loading">Loading data...</div>

    <table>
        <thead>
            <tr>
                <th>User ID</th>
                <th>Task ID</th>
                <th>Title</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody id="todoTable">
        </tbody>
    </table>

    <script src="script.js"></script>

</body>
</html>
